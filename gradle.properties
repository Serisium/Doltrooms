#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
kotlin.js.compiler=ir
#MPP
kotlin.mpp.enableCInteropCommonization=true
# iOS builds happen on macOS hosts only (CI has a dedicated macOS iOS
# job). :driver's cinterop already disables its iOS targets on Linux;
# without this, the cinterop-free dolt-* modules still cross-compile
# iOS test klibs there and fail resolving :driver's (absent) iOS klibs.
kotlin.native.enableKlibsCrossCompilation=false
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
