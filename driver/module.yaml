product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, linuxX64 ]

description: |
  A Room 3 (androidx.room3) SQLiteDriver backed by DoltLite: the SQLite/Room parity engine module (natives, cinterop).

# Mirrors the Gradle build's custom jvmAndroidMain source set (the shared
# JNI declarations, androidx sqlite-bundled's pattern): src@jvmAndroid.
aliases:
  - jvmAndroid: [ jvm, android ]
  # test@nonAndroid holds the Room conformance fixture + suite: the android
  # test fragment must carry NO Room inputs (AAR test-deps never reach the
  # android KSP classpath — see the note at test-dependencies@android).
  - nonAndroid: [ jvm, iosArm64, iosSimulatorArm64, linuxX64 ]

plugins:
  # Builds the DoltLite native pieces as part of the build graph: pinned
  # amalgamation download, host JNI lib (jvm classpath resource), static
  # engine archives + generated cinterop .def (build-plugins/doltlite).
  doltlite: enabled

dependencies:
  # The driver contract we implement (ARCHITECTURE.md D1); exported because
  # DoltLiteDriver's public surface exposes the androidx.sqlite types.
  # androidx.sqlite ONLY — no Room in the main surface (the multi-module
  # split's DAG: Room runtime lives in :dolt-core).
  - androidx.sqlite:sqlite:2.7.0: exported

# kotlin-test is preconfigured by the toolchain for every platform.
test-dependencies:
  # runTest + Dispatchers.Default for the not-thread-affine conformance case.
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0
  # The Room conformance suite is a TEST-ONLY consumer here; the compiler
  # runs via test-settings ksp below.
  - androidx.room3:room3-runtime:3.0.0

test-dependencies@jvm:
  # The differential-conformance oracle: the same common suite runs against
  # BundledSQLiteDriver and DoltLiteDriver. Deliberately jvm-only — on
  # linuxX64 both engines would be statically linked into one test binary
  # and their unprefixed sqlite3_* symbols collide.
  - androidx.sqlite:sqlite-bundled:2.7.0

# No test-dependencies@android: this module's android HOST tests are parked
# in unmigrated/androidHostTest (with the device tests) because AAR-packaged
# maven TEST-dependencies never reach the android KSP classpath (toolchain
# bug, root-caused: kspAndroidTest is wired to the MAIN AAR-transform task,
# so test-scope AARs like room3-runtime stay raw and get filtered out; JAR
# test-deps and main-scope AARs are fine — which is why :dolt-write's
# exported MAIN Room dep works). Repro + draft report:
# github.com/Serisium/kotlin-toolchain-android-testdeps-repro. So Room's
# processor would die with MissingType on any Room fixture in this module's
# android test fragment — the fixture lives in test@nonAndroid instead.

settings:
  kotlin:
    # The driver classes are expect/actual (the bundled-driver template).
    # NOTE: Gradle's explicitApi() has no toolchain equivalent yet;
    # -Xexplicit-api=strict can't go here because freeCompilerArgs propagate
    # into test compilations (lists merge, never override) and the test
    # sources don't declare visibility. Recorded in the migration PR
    # description.
    freeCompilerArgs: [ -Xexpect-actual-classes ]
  android:
    namespace: dev.seri.doltrooms
    compileSdk: 36
    minSdk: 24

# Room's compiler serves tests only (the conformance fixture); on the
# android test fragment it is a no-op because the fixture lives in
# test@nonAndroid (see the alias note above). Requires toolchain >=
# 0.12.0-dev-4213 (KTC-4398) for the native test fragments.
test-settings:
  kotlin:
    ksp:
      processors:
        - androidx.room3:room3-compiler:3.0.0
      processorOptions:
        room.schemaLocation: ./schemas
