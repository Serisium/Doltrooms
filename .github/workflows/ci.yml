name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A superseded run of the same branch/PR proves nothing — cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Kotlin Toolchain build (the ./kotlin wrapper provisions the toolchain,
# a JDK for itself, and the Android SDK; see project.yaml). The doltlite
# build plugin compiles the native engine pieces in-graph — cache keys
# hash its tasks.kt because every relevant pin (doltlite version/sha)
# lives there, plus the wrapper (toolchain version) and module.yamls
# (kotlin/ksp/dependency pins).
jobs:
  # The complete Linux-verifiable matrix: jvm + linuxX64 build AND test
  # (Apple targets can't compile on Linux hosts), plus the android
  # compile. Android HOST tests need java.library.path wiring the
  # toolchain doesn't expose, and android DEVICE tests are unmigrated
  # (no AAR jniLibs packaging yet) — so android is build-only, and the
  # pre-toolchain emulator job is retired until those gaps close.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The doltlite plugin's JNI compile needs a JDK with jni.h; the
      # toolchain's own provisioned JRE has no headers.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Provides ANDROID_HOME with accepted licenses; without it the
      # toolchain self-provisions an SDK and fails the license gate
      # (checkAndroidSdkLicense; observed on a fresh linux host).
      - uses: android-actions/setup-android@v4
      - name: Cache the Kotlin Toolchain distribution + dependency cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: ktc-${{ runner.os }}-${{ hashFiles('kotlin', '**/module.yaml') }}
      - name: Cache Konan (Kotlin/Native compiler + sysroots)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('kotlin') }}
      - name: Cache DoltLite release downloads
        uses: actions/cache@v6
        with:
          path: |
            build/tasks/_driver_prepareAmalgamation@doltlite/*.zip
            driver/native/build/*.zip
          key: doltlite-${{ hashFiles('build-plugins/doltlite/src/tasks.kt') }}
      - name: Build all Linux-buildable platforms
        # linuxX64 test binaries link libcrypt.so.1 via Konan's sysroot;
        # ubuntu ships it (Fedora needs libxcrypt-compat).
        run: ./kotlin build
      - name: Fetch the doltlite-remotesrv test fixture (linux-x64 only)
        run: ./kotlin do fetchRemotesrv
      - name: Run JVM tests (remotesrv sync suite included)
        run: >
          JAVA_TOOL_OPTIONS="-Ddev.seri.doltrooms.remotesrv=$PWD/driver/native/build/tools/doltlite-remotesrv"
          ./kotlin test -p jvm
      - name: Run linuxX64 tests
        run: ./kotlin test -p linuxX64
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: build/logs/

  # The Apple leg: macOS runners are arm64 with simulators preinstalled.
  # Builds every platform a Mac can (including the linuxX64 archive via
  # Konan's cross toolchain) and runs the simulator suites.
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # arm64 macOS images ship no Android SDK; see the linux job note.
      - uses: android-actions/setup-android@v4
      - name: Cache the Kotlin Toolchain distribution + dependency cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: ktc-${{ runner.os }}-${{ hashFiles('kotlin', '**/module.yaml') }}
      - name: Cache Konan (Kotlin/Native compiler + sysroots)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('kotlin') }}
      - name: Cache DoltLite release downloads
        uses: actions/cache@v6
        with:
          path: build/tasks/_driver_prepareAmalgamation@doltlite/*.zip
          key: doltlite-${{ hashFiles('build-plugins/doltlite/src/tasks.kt') }}
      - name: Build all platforms
        run: ./kotlin build
      # Separate invocations per module: a simulator spawn flake at
      # module handoff ("device is not booted", exit 149) was observed
      # when both suites run in one invocation.
      - name: Run the driver suite on the iOS simulator
        run: ./kotlin test -p iosSimulatorArm64 -m driver
      - name: Run the dolt-write suite on the iOS simulator
        run: ./kotlin test -p iosSimulatorArm64 -m dolt-write
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-logs
          path: build/logs/

  # samples/codelab consumed the library from source via Gradle
  # includeBuild("../..") + dependency substitution — impossible against
  # the toolchain build. The sample (and its emulator/xcodebuild jobs)
  # returns when toolchain kmp/lib publishing lands (expected this month)
  # and the sample can consume published artifacts instead.
