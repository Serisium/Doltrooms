name: Publish

on:
  release:
    types: [released, prereleased]

# Kotlin Toolchain publishing (PREVIEW; KTC-719). All seven modules
# publish since the dev-4230 pin (kotlin-toolchain skill, bug ledger —
# every publishing bug fixed upstream). Before the FIRST real release:
# settle the jvm-jar native-library convention (the toolchain packages
# the BUILD HOST's library; the Gradle pipeline always shipped
# linux-x64) and note mavenCentral defaults to `manual` mode — the
# bundle uploads, then a human releases it in the Central Portal UI.
# Secrets live in the 'release' environment, whose deployment policy
# only admits v* tags.
jobs:
  # The tag (vX.Y.Z) must equal the shared publishing version before
  # anything builds or signs — the version lives in ONE place now:
  # publishing.module-template.yaml.
  verify-tag:
    name: Verify tag matches the shared publishing version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare release tag to publishing.module-template.yaml
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="$(sed -n 's/^ *version: \(.*\)$/\1/p' publishing.module-template.yaml | head -1)"
          echo "tag=$tag version=$version"
          if [ -z "$version" ]; then
            echo "::error::Could not extract version from publishing.module-template.yaml"; exit 1
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::Release tag '$tag' does not match publishing version 'v$version'"; exit 1
          fi

  publish:
    name: Release build and publish to Maven Central
    needs: verify-tag
    # Single-host rule: the iOS klibs carry cinterops, and Central
    # forbids duplicate publications — everything publishes from one
    # macOS host (docs/deferred-verification.md).
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: android-actions/setup-android@v4
      # Cross-archive bootstrap: Konan provisions its linux sysroot DURING
      # the first linuxX64 build (after the plugin's archive task already
      # ran), so on a cold runner the first pass skips the cross archive —
      # and would publish a headers-only linuxX64 klib with no embedded
      # engine. First pass is allowed to fail (its test link needs the
      # archive); the second pass must be green: the plugin's freshness
      # check retries the archive once the sysroot exists, the .def gains
      # its linux_x64 entries, and cinterop reruns.
      - name: Prime Konan's linux sysroot (first pass may fail)
        run: ./kotlin build -p linuxX64 || true
      - name: Build linuxX64 with the embedded engine archive
        run: ./kotlin build -p linuxX64
      - name: Publish to Maven Central (manual release mode)
        # Preview default is `manual` mode: the bundle uploads and waits
        # for validation; the human releases it in the Central Portal UI.
        run: ./kotlin publish mavenCentral
        env:
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.GPG_KEY_CONTENTS }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: publish-logs
          path: build/logs/
