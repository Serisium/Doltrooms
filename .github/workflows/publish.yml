name: Publish

on:
  release:
    types: [released, prereleased]

# PARKED for the Kotlin Toolchain migration: kmp/lib publishing is not
# supported by the toolchain yet (announced for later this month). The
# pre-migration Gradle pipeline (tag/version gate -> vanniktech
# publishToMavenCentral from a macOS host, secrets in the 'release'
# environment) is preserved in git history — restore its shape against
# the toolchain's publishing once it ships. Until then a release must
# NOT silently no-op: this job fails loudly so a tagged release is never
# presumed published.
jobs:
  blocked:
    name: Publishing is blocked pending toolchain support
    runs-on: ubuntu-latest
    steps:
      - name: Fail with explanation
        run: |
          echo "::error::Publishing is parked: the Kotlin Toolchain does not support kmp/lib publishing yet (expected later this month). Nothing was published for this release. See the migration PR and git history of this file for the Gradle-era pipeline to restore."
          exit 1
